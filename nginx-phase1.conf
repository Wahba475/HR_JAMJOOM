# =============================================================================
# PHASE 1 CONFIG — temporary, used only to obtain the first certificate.
#
# Why this file exists:
# nginx checks its whole config when it starts. If the config mentions a
# certificate file that is not on disk yet, nginx refuses to start at all.
# That creates a chicken-and-egg problem: you need nginx running to prove you
# own the domain, but you cannot start nginx with an HTTPS config until you
# already have the certificate.
#
# This config breaks that loop. It listens on plain HTTP only, mentions no
# certificate, and does exactly one useful thing: serve the proof file that
# Let's Encrypt comes to fetch.
#
# You use it once (step 2 in docker-compose.yml), get your certificate, then
# switch to nginx.conf and never touch this file again.
# =============================================================================

server {
    # Listen on port 80 — plain, unencrypted HTTP. This is the port a browser
    # uses when the address starts with http:// instead of https://.
    listen 80;

    # Which hostnames this block answers for. Requests arriving for this
    # domain name are handled here.
    server_name wahba-cv-screener.duckdns.org;

    # -------------------------------------------------------------------------
    # THE IMPORTANT PART — the ACME challenge.
    #
    # To prove you control this domain, certbot writes a small random file into
    # the shared certbot-webroot folder. Let's Encrypt's servers then request
    # http://your-domain/.well-known/acme-challenge/<random-filename>
    # If they receive the file certbot wrote, ownership is proven and the
    # certificate is issued.
    #
    # This block is what makes that file reachable.
    # -------------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        # Serve files from this folder on disk. Combined with the URL path
        # above, a request for /.well-known/acme-challenge/abc123 is answered
        # with the file /var/www/certbot/.well-known/acme-challenge/abc123
        #
        # This path is inside the container, and docker-compose maps it to the
        # ./certbot-webroot folder on your server.
        root /var/www/certbot;
    }

    # -------------------------------------------------------------------------
    # Everything else gets a harmless placeholder.
    #
    # We are not proxying to the backend yet — this config exists purely to
    # satisfy the certificate check. A plain text reply also gives you an easy
    # way to confirm nginx is alive and your DNS points here:
    #     curl http://wahba-cv-screener.duckdns.org
    # -------------------------------------------------------------------------
    location / {
        # 200 = the HTTP code for "OK". The quoted text is the response body.
        return 200 "Phase 1: nginx is running. Ready for certbot.\n";

        # Tells the browser this is plain text, not HTML, so it displays as-is.
        add_header Content-Type text/plain;
    }
}

<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom animation for the progress ring to simulate active processing */
        @keyframes drawProgress {
            0% {
                stroke-dashoffset: 283;
            }
            100% {
                stroke-dashoffset: 248; /* Roughly 12% for 42/340 */
            }
        }
        
        @keyframes pulseRing {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .animate-draw {
            animation: drawProgress 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .animate-pulse-ring {
            animation: pulseRing 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-surface-container-lowest font-body-md text-on-surface h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Header: Suppressing global nav for transactional/processing state, providing brand anchor only -->
<header class="h-16 w-full flex items-center bg-surface-container-lowest border-b border-outline-variant px-container-padding shrink-0 transition-all duration-200 ease-in-out">
<div class="max-w-7xl mx-auto w-full flex items-center gap-4">
<img alt="Jamjoom Pharma Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_7rddODWOzXfsw2uITEjMylm-LrRMngUqu29k722hnB9UjmKB24zqyxFijcsw-RvskSRI5eRlC7_64FgV5JCM0_Ynhgq2cs_bjLN5HLHMQoYbzj3y1H8jXpR-ZnWQ9S7qRbPVQciAIamCEfzbKHkM_NMDRo5Wg70dg9I4qa31d3i0VHQH_KJhx-YnS_XOh81GsUpwm80yPNSPpzPwosUt6jEvkLYaGm_-JAOd7QCrQLW6dH8rrpclVG0NBk7fHdKHnw"/>
<div class="h-6 w-px bg-outline-variant"></div>
<h1 class="font-headline-md text-primary">CV Screener</h1>
</div>
</header>
<!-- Main Content Canvas: Centered Progress State -->
<main class="flex-1 w-full max-w-7xl mx-auto px-container-padding flex flex-col items-center justify-center relative">
<!-- Decorative subtle background element (Glassmorphism hint without overwhelming) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden opacity-50">
<div class="w-[600px] h-[600px] bg-primary-fixed-dim rounded-full blur-[120px] opacity-20 animate-pulse-ring"></div>
</div>
<!-- Central Progress Container -->
<div class="relative z-10 flex flex-col items-center">
<!-- Circular Progress Indicator -->
<div class="relative w-48 h-48 sm:w-64 sm:h-64 mb-stack-lg">
<!-- SVG Ring -->
<svg class="w-full h-full -rotate-90 transform drop-shadow-sm" viewbox="0 0 100 100">
<!-- Background Track -->
<circle class="text-surface-container-high" cx="50" cy="50" fill="transparent" r="45" stroke="currentColor" stroke-width="4"></circle>
<!-- Animated Fill Track (Circumference ~283) -->
<circle class="text-primary animate-draw" cx="50" cy="50" fill="transparent" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Inner Content (Percentage & Icon) -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-headline-lg text-primary tracking-tighter tabular-nums">12%</span>
<span class="material-symbols-outlined text-secondary mt-1 opacity-70 animate-pulse-ring" style="font-variation-settings: 'FILL' 1;">
                        document_scanner
                    </span>
</div>
</div>
<!-- Typography Structure -->
<div class="text-center max-w-md space-y-base">
<h2 class="font-headline-sm text-on-surface">
                    Processing 42 of 340 CVs
                </h2>
<p class="font-body-md text-on-surface-variant leading-relaxed">
                    Reading each CV and comparing it against your criteria
                </p>
</div>
</div>
</main>
</body></html>

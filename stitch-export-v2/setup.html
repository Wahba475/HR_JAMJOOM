<style>
        body { background-color: #010102; color: #e4e1eb; }
        .dashed-border { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%2323252aFF' stroke-width='2' stroke-dasharray='8%2c8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); }
    </style>

<body class="bg-canvas text-on-surface font-body antialiased flex flex-col min-h-screen selection:bg-primary-container selection:text-white">
<!-- TopNavBar (Linear Transactional - Suppressed main nav, keeping brand anchor) -->
<header class="flex justify-between items-center px-lg w-full sticky top-0 z-50 h-16 bg-canvas border-b border-hairline flat no-shadows">
<div class="flex items-center gap-xs">
<span class="font-headline text-headline text-on-surface font-bold tracking-tight">CV Screener</span>
</div>
<div class="flex items-center gap-md">
<button class="text-ink-subtle hover:text-on-surface transition-colors font-button text-button">Help Center</button>
<div class="h-8 w-8 rounded-full bg-surface-1 overflow-hidden border border-hairline">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A small, professional headshot of an HR user, softly lit against a dark background, minimal details, corporate tone." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDgWGxmpBkADcCVO2CMXiQSnoJgfHMzl4mH1D8QeqirctgMl-jb6XaAisO1PMQEqotdJfQNJ86LQEL45qiWsY6LKUetgJb6e6hdjDW6Aj761kozJWuZXCt-TVZix_zP85hFeUi__TJXV49PoVxk8YF4G-933SZhjC0sK8wqk6ulHt49zruZItIPks_ZO4ACcusU7yGpxouFL_zn9styrDF3prc-BTpPc9Jn1OdVuTg9mm4IimOBcAq"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex justify-center py-section px-md">
<div class="w-full max-w-[600px] flex flex-col gap-xl">
<div class="flex flex-col gap-xs text-center md:text-left">
<h1 class="font-display-md text-display-md text-on-surface tracking-tighter">Screen candidates for a role</h1>
<p class="font-body-lg text-body-lg text-ink-subtle">Define the criteria and upload resumes to begin the automated screening process.</p>
</div>
<form class="flex flex-col gap-lg w-full">
<!-- Job Title Input -->
<div class="flex flex-col gap-xs">
<label class="font-eyebrow text-eyebrow text-ink-subtle uppercase tracking-wider" for="job-title">Job title</label>
<input class="bg-surface-1 border-hairline rounded-lg text-on-surface placeholder:text-ink-tertiary focus:border-primary-focus focus:ring-1 focus:ring-primary-focus font-body text-body py-sm px-md transition-all shadow-none" id="job-title" placeholder="e.g. Senior Product Designer" type="text"/>
</div>
<!-- Job Description Input -->
<div class="flex flex-col gap-xs">
<label class="font-eyebrow text-eyebrow text-ink-subtle uppercase tracking-wider" for="job-description">Job description</label>
<textarea class="bg-surface-1 border-hairline rounded-lg text-on-surface placeholder:text-ink-tertiary focus:border-primary-focus focus:ring-1 focus:ring-primary-focus font-body text-body py-sm px-md transition-all shadow-none resize-y" id="job-description" placeholder="Paste the full job description here..." rows="4"></textarea>
</div>
<!-- Hiring Criteria Input -->
<div class="flex flex-col gap-xs">
<label class="font-eyebrow text-eyebrow text-ink-subtle uppercase tracking-wider" for="hiring-criteria">Hiring criteria <span class="text-ink-tertiary font-normal">(Optional)</span></label>
<textarea class="bg-surface-1 border-hairline rounded-lg text-on-surface placeholder:text-ink-tertiary focus:border-primary-focus focus:ring-1 focus:ring-primary-focus font-body text-body py-sm px-md transition-all shadow-none resize-y" id="hiring-criteria" placeholder="Specific skills, years of experience, or required certifications..." rows="3"></textarea>
</div>
<!-- Target Shortlist Size -->
<div class="flex flex-col gap-xs">
<label class="font-eyebrow text-eyebrow text-ink-subtle uppercase tracking-wider" for="shortlist-size">Target Shortlist Size</label>
<input class="bg-surface-1 border-hairline rounded-lg text-on-surface placeholder:text-ink-tertiary focus:border-primary-focus focus:ring-1 focus:ring-primary-focus font-body text-body py-sm px-md transition-all shadow-none w-32" id="shortlist-size" min="1" type="number" value="5"/>
</div>
<!-- Resume Dropzone -->
<div class="flex flex-col gap-sm">
<label class="font-eyebrow text-eyebrow text-ink-subtle uppercase tracking-wider">Upload Resumes</label>
<div class="dashed-border rounded-xl bg-surface-1 hover:bg-surface-2 transition-colors cursor-pointer flex flex-col items-center justify-center py-xl px-md group">
<span class="material-symbols-outlined text-outline group-hover:text-primary-focus transition-colors text-4xl mb-sm" style="font-variation-settings: 'FILL' 0, 'wght' 200;">upload_file</span>
<p class="font-body-lg text-body-lg text-on-surface font-medium">Drag and drop CVs here...</p>
<p class="font-body-sm text-body-sm text-ink-subtle mt-xxs">PDF only, max 5MB per file</p>
</div>
<!-- File Chips -->
<div class="flex flex-wrap gap-xs mt-xs">
<div class="flex items-center bg-surface-2 border border-hairline rounded-full py-xxs px-sm gap-xs">
<span class="material-symbols-outlined text-ink-subtle text-sm">description</span>
<span class="font-caption text-caption text-on-surface">ahmed_hassan_cv.pdf</span>
<button class="text-ink-tertiary hover:text-error transition-colors flex items-center ml-xs" type="button">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<div class="flex items-center bg-surface-2 border border-hairline rounded-full py-xxs px-sm gap-xs">
<span class="material-symbols-outlined text-ink-subtle text-sm">description</span>
<span class="font-caption text-caption text-on-surface">sarah_alghamdi_resume.pdf</span>
<button class="text-ink-tertiary hover:text-error transition-colors flex items-center ml-xs" type="button">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</div>
<!-- Action Bar -->
<div class="pt-lg border-t border-hairline flex justify-end gap-sm mt-md">
<button class="font-button text-button bg-surface-1 border border-hairline text-on-surface hover:bg-surface-2 rounded-lg py-sm px-lg transition-colors shadow-none" type="button">
                        Cancel
                    </button>
<button class="font-button text-button bg-primary-container text-white hover:bg-primary-focus rounded-lg py-sm px-lg transition-colors shadow-none flex items-center gap-xs" type="button">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                        Run Screening
                    </button>
</div>
</form>
</div>
</main>
</body></html>

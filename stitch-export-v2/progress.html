<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.canvas');
            color: theme('colors.on-background');
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        
        .pulse-layer {
            animation: pulse-ring 3s infinite ease-in-out;
            transform-origin: center;
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-canvas">
<!-- Top Nav Area (Transactional/Focused - No nav links) -->
<header class="absolute top-0 left-0 w-full flex justify-between items-center px-lg py-md z-50">
<div class="flex items-center gap-sm">
<span class="font-headline text-headline text-on-surface">CV Screener</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full flex flex-col items-center justify-center p-md z-10 relative">
<!-- Progress Indicator Container -->
<div class="relative flex flex-col items-center">
<!-- Circular SVG Progress -->
<div class="relative w-48 h-48 sm:w-64 sm:h-64 mb-xl">
<!-- Background Pulse Effect -->
<div class="absolute inset-0 rounded-full border border-primary-container/20 pulse-layer"></div>
<div class="absolute inset-2 rounded-full border border-primary-container/10 pulse-layer" style="animation-delay: 1s;"></div>
<svg class="w-full h-full" viewbox="0 0 120 120">
<!-- Background Track -->
<circle cx="60" cy="60" fill="none" r="54" stroke="theme('colors.surface-container-high')" stroke-width="4"></circle>
<!-- Progress Fill -->
<circle class="progress-ring__circle" cx="60" cy="60" fill="none" r="54" stroke="theme('colors.primary-container')" stroke-dasharray="339.292" stroke-dashoffset="300" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Inner Percentage / Count (Optional visual anchor, keeping minimal per prompt) -->
<div class="absolute inset-0 flex items-center justify-center flex-col">
<span class="font-display-md text-display-md text-on-surface tracking-tighter" id="percentage">12%</span>
</div>
</div>
<!-- Typography -->
<div class="text-center max-w-md mx-auto">
<h1 class="font-display-md text-display-md text-on-surface mb-sm tracking-tighter">
                    Processing 42 of 340 CVs
                </h1>
<p class="font-body-lg text-body-lg text-ink-subtle">
                    Reading each CV and comparing it against your criteria
                </p>
</div>
<!-- Subtle Activity Indicator -->
<div class="mt-xl flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary-container animate-ping"></div>
<span class="font-mono text-mono text-ink-tertiary uppercase tracking-widest">Analyzing Data</span>
</div>
</div>
</main>
<!-- Ambient background glows -->
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-[120px] -z-10 pointer-events-none mix-blend-screen"></div>
<div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-primary-container/5 rounded-full blur-[100px] -z-10 pointer-events-none mix-blend-screen"></div>
<script>
        // Simple script to animate the progress ring for demonstration purposes
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('.progress-ring__circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            
            function setProgress(percent) {
                const offset = circumference - (percent / 100) * circumference;
                circle.style.strokeDashoffset = offset;
            }
            
            // Initial state
            const targetPercent = (42 / 340) * 100;
            
            // Animate to current state
            setTimeout(() => {
                setProgress(targetPercent);
            }, 100);
            
            // Optional: simulate progress over time
            let current = 42;
            const max = 340;
            const percentDisplay = document.getElementById('percentage');
            
            const interval = setInterval(() => {
                if (current < max) {
                    current++;
                    const newPercent = (current / max) * 100;
                    setProgress(newPercent);
                    percentDisplay.textContent = Math.round(newPercent) + '%';
                    
                    // Update text roughly
                    const h1 = document.querySelector('h1');
                    h1.textContent = `Processing ${current} of ${max} CVs`;
                } else {
                    clearInterval(interval);
                }
            }, 2000); // simulate a CV processed every 2 seconds
        });
    </script>

# =============================================================================
# FINAL CONFIG — HTTPS enabled, proxying to the backend.
#
# Do NOT put this file in place until the certificate exists. nginx validates
# its entire config at startup, and the ssl_certificate lines below point at
# files on disk. If those files are missing, nginx refuses to start and your
# site goes down. Use nginx-phase1.conf first.
#
# -----------------------------------------------------------------------------
# FULL COMMAND SEQUENCE — nothing to working HTTPS.
# Run from this directory, in order. Verify each step before the next.
# -----------------------------------------------------------------------------
#
# 1. Create the folders nginx and certbot share:
#
#      mkdir -p certbot-webroot letsencrypt
#
# 2. Start with the temporary port-80-only config, so nginx can boot with no
#    certificate present:
#
#      cp nginx-phase1.conf nginx.conf.active
#      docker compose up -d --build
#
#    Confirm nginx answers (expect the phase 1 placeholder text):
#      curl http://wahba-cv-screener.duckdns.org
#
# 3. Request the certificate. certbot writes a proof file into
#    certbot-webroot, Let's Encrypt fetches it over HTTP, and issues the cert:
#
#      docker compose run --rm certbot certonly \
#        --webroot -w /var/www/certbot \
#        -d wahba-cv-screener.duckdns.org \
#        --email abdulrahman.wahba2005@gmail.com \
#        --agree-tos --no-eff-email
#
# 4. Confirm the certificate files exist. Both fullchain.pem and privkey.pem
#    must be listed. If this folder is missing, do not continue:
#
#      sudo ls -l letsencrypt/live/wahba-cv-screener.duckdns.org/
#
# 5. Switch to this config and restart nginx:
#
#      cp nginx.conf nginx.conf.active
#      docker compose restart nginx
#
# 6. Verify HTTPS works:
#
#      curl -s -o /dev/null -w "%{http_code}\n" https://wahba-cv-screener.duckdns.org/runs
#
# -----------------------------------------------------------------------------
# RENEWAL — certificates last 90 days. Run monthly (or via cron):
#
#      docker compose run --rm certbot renew && docker compose restart nginx
#
# =============================================================================


# -----------------------------------------------------------------------------
# SERVER BLOCK 1 — port 80 (plain HTTP).
#
# Two jobs: keep serving the certbot challenge so renewals keep working, and
# push every human visitor over to the encrypted HTTPS site.
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name wahba-cv-screener.duckdns.org;

    # Renewals repeat the same proof-of-ownership check as the first issue,
    # over plain HTTP on port 80. If you delete this block, the certificate
    # will silently fail to renew and the site breaks in ~90 days.
    #
    # This must come BEFORE the redirect below: nginx picks the most specific
    # matching location, so challenge requests are served here rather than
    # being bounced to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to the https:// version of the same URL.
    #   301        = "moved permanently", the standard redirect for this.
    #   $host      = the domain the visitor typed.
    #   $request_uri = the rest of the path, so deep links survive the jump.
    location / {
        return 301 https://$host$request_uri;
    }
}


# -----------------------------------------------------------------------------
# SERVER BLOCK 2 — port 443 (HTTPS). This is the real site.
# -----------------------------------------------------------------------------
server {
    # "ssl" tells nginx to expect encrypted traffic on this port.
    listen 443 ssl;
    server_name wahba-cv-screener.duckdns.org;

    # --- The certificate ------------------------------------------------------
    # fullchain.pem = your certificate plus the intermediate certificates that
    #                 link it back to a root the browser already trusts. Using
    #                 the "full" chain avoids "untrusted certificate" warnings
    #                 on Android and some older clients.
    # privkey.pem   = the private key. It proves the certificate is yours.
    #                 Never share this file or commit it to git.
    #
    # These paths are inside the container; docker-compose maps them to the
    # ./letsencrypt folder on your server.
    ssl_certificate     /etc/letsencrypt/live/wahba-cv-screener.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wahba-cv-screener.duckdns.org/privkey.pem;

    # Only allow modern encryption protocols. TLS 1.0 and 1.1 are old and
    # insecure; leaving them enabled is a common audit failure.
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Upload size ----------------------------------------------------------
    # nginx rejects any request body larger than this with a "413 Payload Too
    # Large" error. The default is only 1 MB, which is far too small here:
    # 200 CV PDFs arrive as a single multipart upload. Without this line, the
    # upload fails before it ever reaches the backend.
    client_max_body_size 200M;

    # Renewals can also be validated over HTTPS in some certbot setups, so the
    # challenge path is repeated here. Harmless, and saves a confusing failure
    # if the redirect above is ever changed.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- The API --------------------------------------------------------------
    # Every backend route begins with /runs, so this one block covers the API.
    location /runs {
        # Hand the request to the backend container.
        #
        # "cv-api" is the service name from docker-compose.yml. Docker runs an
        # internal DNS server, so containers on the same network reach each
        # other by service name — no IP addresses needed, and the name keeps
        # working after a restart even if the IP changes.
        #
        # This hop is plain HTTP, but it never leaves the server: it travels
        # only over Docker's internal network. The encryption the outside world
        # sees ends here at nginx, which is the normal arrangement.
        proxy_pass http://cv-api:8000;

        # Without this, the backend would see "cv-api" as the hostname. Passing
        # the original domain through keeps redirects and any generated links
        # pointing at the real public address.
        proxy_set_header Host $host;

        # Pass the visitor's real IP through. Otherwise every request appears
        # to come from nginx's internal Docker IP, which makes logs useless and
        # breaks any future rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tells the backend the original request arrived over HTTPS, since the
        # hop from nginx to the backend is plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Timeouts ---------------------------------------------------------
        # How long nginx waits for the backend to respond before giving up with
        # a "504 Gateway Timeout". The default is 60 seconds, which is not
        # enough here: a 200-CV screening run takes a couple of minutes, and a
        # large upload alone takes ~30 seconds.
        #
        # 600s = 10 minutes, comfortably more than the slowest observed run.
        proxy_read_timeout 600s;

        # How long nginx waits while sending the request body up to the
        # backend. Matters for big uploads on a slow connection.
        proxy_send_timeout 600s;
    }
}
